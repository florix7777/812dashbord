server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Excel-отчёты загружаются через сайт; по умолчанию nginx режет всё больше 1 МБ
    client_max_body_size 25m;

    # Пароль на сайт сейчас ВЫКЛЮЧЕН (по решению владельца): сайт открыт всем, кто знает адрес.
    # Чтобы включить обратно: раскомментируйте две строки ниже, создайте файл .htpasswd
    # (см. DEPLOY.md, раздел «Пароль на сайт»), добавьте в Dockerfile строку
    #   COPY .htpasswd /etc/nginx/.htpasswd
    # и пересоберите: docker compose up -d --build
    # auth_basic "QC Dashboard";
    # auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    error_page 404 /index.html;
}

