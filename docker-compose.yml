# Dashboard SC: сайт (nginx) + API + база. Updater больше не нужен:
# файлы разбираются сразу при загрузке на сайте.
services:
  postgres:
    image: postgres:16-alpine
    container_name: qc_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-qc_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
      POSTGRES_DB: ${POSTGRES_DB:-qc_dashboard}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # порты наружу не открываем: база доступна только другим контейнерам
    networks: [qc_network]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qc_user} -d ${POSTGRES_DB:-qc_dashboard}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: qc_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-qc_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-qc_dashboard}
      REPORTS_DIR: /app/reports
      DATA_MODE: api
      AUTO_IMPORT_DIR: /app/initial_data
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-20971520}
    volumes:
      - ./reports:/app/reports                  # архив загруженных через сайт файлов
      - ./initial_data:/app/initial_data:ro     # отчёты для первой загрузки (читаются только при пустой базе)
    # порты наружу не открываем: к API ходит только nginx (там пароль на сайт)
    networks: [qc_network]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  nginx:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qc_nginx
    restart: unless-stopped
    depends_on: [backend]
    ports:
      - "${HTTP_PORT:-8080}:80"       # 80 занят другим проектом на сервере
    networks: [qc_network]

volumes:
  postgres_data:

networks:
  qc_network:
    driver: bridge
